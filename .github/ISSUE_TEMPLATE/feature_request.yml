name: Feature Request
description: Suggest a new component or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion. Please describe the feature you'd like to see.

  - type: dropdown
    id: type
    attributes:
      label: Request type
      options:
        - New component
        - Enhancement to existing component
        - New design token
        - Documentation improvement
        - Other
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component
      description: Which component does this relate to? (Leave blank for new components)
      placeholder: e.g. gup-dropdown-field, gup-button

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the feature or enhancement.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem does this solve? How would you use this feature?
    validations:
      required: true

  - type: textarea
    id: designs
    attributes:
      label: Design reference
      description: Link to Figma designs, screenshots, or examples from other libraries.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any alternative solutions or workarounds?
