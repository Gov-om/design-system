name: CI - Lint & Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build icons
        run: npx nx run @govom/icons:build

      - name: Lint CSS
        run: npx nx run @govom/components:lint:css

      - name: Lint TypeScript
        run: npx nx run @govom/components:lint:ts

      - name: Lint (lit-analyzer)
        run: npx nx run @govom/components:lint:lit

      - name: Lint ESLint
        run: npx nx run @govom/components:lint:eslint

      - name: Build lite-components
        run: npx nx run @govom/lite-components:build

      - name: Lint lite-components
        run: npx nx run @govom/lite-components:lint:all

      - name: Install Playwright dependencies
        run: npx playwright install-deps

      # Builds the components Storybook, which includes the Lite Components stories, so this
      # covers both packages. A separate lite target would only repeat the Storybook build.
      - name: Lint Accessibility
        continue-on-error: true
        run: npx nx run @govom/components:lint:a11y

      - name: Lint Prettier
        run: npx nx run @govom/components:lint:prettier
