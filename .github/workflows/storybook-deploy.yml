name: Deploy Storybook

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy Storybook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright dependencies
        run: npx playwright install-deps

      - name: Build icons
        run: npx nx run @gup-ds/icons:build

      - name: Build Storybook
        run: npx nx run @gup-ds/components:build-storybook

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Oracle Container Registry
        uses: docker/login-action@v3
        with:
          registry: ocir.me-dcc-muscat-1.oci.oraclecloud9.com
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ocir.me-dcc-muscat-1.oci.oraclecloud9.com/ax5y9rn5ycg2/gup-web-components-storybook:${{ github.run_number }}
            ocir.me-dcc-muscat-1.oci.oraclecloud9.com/ax5y9rn5ycg2/gup-web-components-storybook:latest

      - name: Build and push Docker image (new URL)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-new-url
          push: true
          tags: |
            ocir.me-dcc-muscat-1.oci.oraclecloud9.com/ax5y9rn5ycg2/gup-web-components-storybook-new-url:${{ github.run_number }}
            ocir.me-dcc-muscat-1.oci.oraclecloud9.com/ax5y9rn5ycg2/gup-web-components-storybook-new-url:latest
