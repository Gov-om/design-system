name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (no actual publish)'
        required: false
        default: false
        type: boolean
      first-release:
        description: 'First release (no previous git tags exist, uses current package.json versions as-is)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Build icons
        run: npx nx run @govom/icons:build

      - name: Build components
        run: npx nx run @govom/components:build

      - name: Version (determine next versions and update changelogs)
        run: npx nx release --skip-publish ${{ inputs.first-release == true && '--first-release' || '' }}

      - name: "Replace file: reference with real version in react package"
        run: |
          COMPONENTS_VERSION=$(node -p "require('./packages/components/package.json').version")
          sed -i "s|\"file:../components\"|\"${COMPONENTS_VERSION}\"|g" packages/react/package.json
          echo "Set @govom/components to ${COMPONENTS_VERSION} in react/package.json"

      - name: Push version commits and tags
        if: ${{ !inputs.dry-run }}
        run: |
          git push origin HEAD --follow-tags

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: npx nx release publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}